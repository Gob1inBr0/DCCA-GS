<text x='1273.0' y='578.0' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>载荷计入 total_MB（默认关）</text>
<rect x='24' y='700' width='1352.0' height='130.0' rx='12' fill='#faf3fc' stroke='#6a1b9a' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='724' text-anchor='start' font-size='15' fill='#6a1b9a' font-weight='bold' opacity='1.0'>体积构成 total_MB（hac_meta.json 逐项记录，fp32 口径）</text>
<text x='40' y='734' text-anchor='start' font-size='13' fill='#263238' font-weight='normal' opacity='1.0'>total_bits = bit_anchor(G-PCC) + bit_feat + bit_scaling + bit_offsets + bit_hash + bit_masks + bit_attr_ctx(可选)</text>
<text x='40' y='758' text-anchor='start' font-size='13' fill='#263238' font-weight='normal' opacity='1.0'>             + bit_mlp（全部 mlp_* 参数 × 32bit，含 mlp_complexity）+ bit_bounds（2×[3] fp32）+ header</text>
<text x='40' y='786' text-anchor='start' font-size='12.5' fill='#546e7a' font-weight='normal' opacity='1.0'>total_MB = total_bits / 8×1024×1024      ·      后处理旋钮：q_scale_{feat,scaling,offsets} 与 mask_keep_ratio（编码时再丢低分锚）</text>
