<circle cx='1223.0' cy='210' r='13' fill='#fdecea' stroke='#c62828' stroke-width='1.8' stroke-dasharray='5,4'/>
<text x='1223.0' y='214' text-anchor='middle' font-size='16' fill='#c62828' font-weight='bold' opacity='1.0'>✗</text>
<rect x='688' y='452' width='628.0' height='200.0' rx='12' fill='#f2f8f2' stroke='#2e7d32' stroke-width='1.4' opacity='1.0'/>
<text x='702' y='476' text-anchor='start' font-size='15' fill='#2e7d32' font-weight='bold' opacity='1.0'>特性</text>
<text x='704' y='486' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 无条件：不依赖分数是否合理——失败模式在构造上不可能</text>
<text x='704' y='512' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 解码零成本：纯训练侧投影规则，码流不变</text>
<text x='704' y='538' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 单独启用时锚点数几乎不变（4-10：671,570 vs 671,497）——它是保险，不是旋钮</text>
<text x='704' y='564' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 与 fig07 软帽互补：软帽防分数失衡，硬约束兜底任何残余风险；</text>
<text x='716' y='586' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>正是有了它，融合剪枝才敢在低码率档位启用</text>
<text x='704' y='614' text-anchor='start' font-size='11.5' fill='#c62828' font-weight='normal' opacity='1.0'>注：论文正文 δ=0.05 为旧值，代码/config 实际默认 0.01 · mn=1</text>
<rect x='24' y='672' width='1292.0' height='80.0' rx='12' fill='#fdfefe' stroke='#78909c' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='696' text-anchor='start' font-size='15' fill='#263238' font-weight='bold' opacity='1.0'>与 fig06/fig07 的关系</text>
<text x='40' y='712' text-anchor='start' font-size='13' fill='#263238' font-weight='normal' opacity='1.0'>fig06 ADMM 决定“留多少”（κ）；fig07 融合分数决定“按什么排序”；本图决定“无论怎么排，每个区域都有人留守”。三者叠加 = 覆盖感知融合剪枝</text>
<text x='40' y='736' text-anchor='start' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>默认关闭（spa_coverage_constraint=False），低码率档位与融合剪枝一起启用</text>
<line x1='16' y1='766' x2='1324' y2='766' stroke='#cfd8dc' stroke-width='1'/>
<text x='18' y='780' text-anchor='start' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>代码: hacplus/scene/gaussian_model.py:1725–1757（胞划分/mandated/fill） · config.py:193–198</text>
<text x='1322' y='780' text-anchor='end' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>cell=0.01 · min_per_cell=1</text>
