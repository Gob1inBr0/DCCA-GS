<svg xmlns='http://www.w3.org/2000/svg' width='1340' height='800' viewBox='0 0 1340 800' font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif"><defs><marker id='ar_607d8b' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto'><path d='M0,0 L8,4.5 L0,9 z' fill='#607d8b'/></marker><marker id='ar_2e7d32' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto'><path d='M0,0 L8,4.5 L0,9 z' fill='#2e7d32'/></marker></defs>
<rect x='8' y='8' width='1324' height='784' rx='14' fill='#fdfefe' stroke='#cfd8dc' stroke-width='1.5'/>
<text x='670.0' y='40' text-anchor='middle' font-size='21' font-weight='bold' fill='#263238'>创新①（监督侧）：渲染敏感度信号链——只在训练里存在的“重要性标注员”</text>
<text x='670.0' y='62' text-anchor='middle' font-size='12.5' fill='#546e7a'>反传后取各锚点属性的梯度范数做 EMA；以相对归一化 z 构造有界 target，回归监督 mlp_complexity；解码端从头到尾不需要它</text>
<rect x='24' y='92' width='1292.0' height='250.0' rx='12' fill='#f5f7f8' stroke='#607d8b' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='116' text-anchor='start' font-size='15' fill='#263238' font-weight='bold' opacity='1.0'>信号采集（每步、反传之后）</text>
<rect x='40' y='134' width='210.0' height='90.0' rx='10' fill='blue_bg' stroke='blue' stroke-width='1.8' opacity='1.0'/>
<text x='145.0' y='158' text-anchor='middle' font-size='13' fill='blue' font-weight='bold' opacity='1.0'>retain_grad</text>
<text x='145.0' y='171.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>渲染前对 feat /</text>
<text x='145.0' y='187.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>grid_scaling / grid_offsets</text>
<text x='145.0' y='203.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>保留梯度</text>
<rect x='294' y='134' width='190.0' height='58.0' rx='10' fill='blue_bg' stroke='blue' stroke-width='1.8' opacity='1.0'/>
<text x='389.0' y='158' text-anchor='middle' font-size='13' fill='blue' font-weight='bold' opacity='1.0'>loss.backward()</text>
<text x='389.0' y='171.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>（L 含全部项）</text>
<rect x='528' y='134' width='250.0' height='74.0' rx='10' fill='grey_bg' stroke='grey' stroke-width='1.8' stroke-dasharray='7,4' opacity='1.0'/>
<text x='653.0' y='158' text-anchor='middle' font-size='13' fill='grey' font-weight='bold' opacity='1.0'>g = ‖∂L/∂a‖₂</text>
<text x='653.0' y='171.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>逐锚点 · 逐字段梯度范数</text>
<text x='653.0' y='187.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>（按 anchor_indices 归并到 N）</text>
<rect x='822' y='134' width='240.0' height='74.0' rx='10' fill='grey_bg' stroke='grey' stroke-width='1.8' stroke-dasharray='7,4' opacity='1.0'/>
<text x='942.0' y='158' text-anchor='middle' font-size='13' fill='grey' font-weight='bold' opacity='1.0'>EMA  α = 0.99</text>
<text x='942.0' y='171.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>s ← 0.99·s + 0.01·g</text>
<text x='942.0' y='187.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>index_add 仅本轮可见锚</text>
<rect x='1106' y='134' width='194.0' height='89.5' rx='10' fill='grey_bg' stroke='grey' stroke-width='1.8' stroke-dasharray='7,4' opacity='1.0'/>
<text x='1203.0' y='157.5' text-anchor='middle' font-size='12.5' fill='grey' font-weight='bold' opacity='1.0'>敏感度状态</text>
<text x='1203.0' y='171.0' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>sensitivity_feat /</text>
<text x='1203.0' y='187.0' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>scaling / offsets</text>
<text x='1203.0' y='203.0' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>各 [N,1]（+mean/var EMA）</text>
<line x1='253' y1='176' x2='290' y2='176' stroke='#607d8b' stroke-width='2.0' stroke-dasharray='7,4' marker-end='url(#ar_607d8b)'/>
<line x1='487' y1='176' x2='524' y2='176' stroke='#607d8b' stroke-width='2.0' stroke-dasharray='7,4' marker-end='url(#ar_607d8b)'/>
<line x1='781' y1='176' x2='818' y2='176' stroke='#607d8b' stroke-width='2.0' stroke-dasharray='7,4' marker-end='url(#ar_607d8b)'/>
<line x1='1065' y1='176' x2='1102' y2='176' stroke='#607d8b' stroke-width='2.0' stroke-dasharray='7,4' marker-end='url(#ar_607d8b)'/>
<rect x='40' y='262' width='471.4' height='20.0' rx='10.0' fill='amber_bg' stroke='#b26a00' stroke-width='1.1' opacity='1.0'/>
<text x='275.69000000000005' y='278' text-anchor='middle' font-size='11' fill='#b26a00' font-weight='normal' opacity='1.0'>生效条件: sensitivity_enabled ∧ is_training ∧ t ≥ sensitivity_start_iter（默认 20000）</text>
<rect x='24' y='366' width='780.0' height='300.0' rx='12' fill='#f2f8f2' stroke='#2e7d32' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='390' text-anchor='start' font-size='15' fill='#2e7d32' font-weight='bold' opacity='1.0'>监督支路（t ≥ 20000，L_sens 项）</text>
<rect x='40' y='408' width='340.0' height='90.0' rx='10' fill='#ffffff' stroke='#cfd8dc' stroke-width='1.8' opacity='1.0'/>
<text x='210.0' y='432' text-anchor='middle' font-size='13' fill='#263238' font-weight='bold' opacity='1.0'>z = (s − mean) / mean</text>
<text x='210.0' y='445.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>相对归一化（以均值为中心）</text>
<text x='210.0' y='461.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>注：方差 z-score 在 α=0.99 下不收敛，</text>
<text x='210.0' y='477.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>信号会被压平 → 改用相对归一化</text>
<rect x='420' y='408' width='372.0' height='90.0' rx='10' fill='green_bg' stroke='green' stroke-width='1.8' opacity='1.0'/>
<text x='606.0' y='432' text-anchor='middle' font-size='13' fill='green' font-weight='bold' opacity='1.0'>target = clamp(1 + tanh(−z), 0.1, 2.0)</text>
<text x='606.0' y='445.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>高敏感 z&gt;0 → target&lt;1（要细 Q）</text>
<text x='606.0' y='461.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>低敏感 z&lt;0 → target&gt;1（可粗 Q）</text>
<text x='606.0' y='477.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>clamp 防止 Q→0 时算术编码 CDF 出 NaN</text>
<line x1='380' y1='452' x2='416' y2='452' stroke='#2e7d32' stroke-width='2.0' marker-end='url(#ar_2e7d32)'/>
<rect x='40' y='530' width='340.0' height='74.0' rx='10' fill='green_bg' stroke='green' stroke-width='1.8' opacity='1.0'/>
<text x='210.0' y='554' text-anchor='middle' font-size='13' fill='green' font-weight='bold' opacity='1.0'>pred = 1 + tanh(mlp_complexity logits)</text>
<text x='210.0' y='567.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>可微 → 梯度直达 mlp_complexity</text>
<text x='210.0' y='583.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>target 侧 detach（只当标签用）</text>
<rect x='420' y='530' width='372.0' height='90.0' rx='10' fill='green_bg' stroke='green' stroke-width='1.8' opacity='1.0'/>
<text x='606.0' y='554' text-anchor='middle' font-size='13' fill='green' font-weight='bold' opacity='1.0'>L_sens = 1e-3 · MSE(pred, target)</text>
<text x='606.0' y='567.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>sensitivity_weight = λsens = 1e-3</text>
<text x='606.0' y='583.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>“从结构预测重要性”：结构在 x 里，</text>
<text x='606.0' y='599.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>重要性标签来自渲染梯度</text>
<line x1='380' y1='574' x2='416' y2='574' stroke='#2e7d32' stroke-width='2.0' marker-end='url(#ar_2e7d32)'/>
<path d='M606,498.0L606,520L606,526' fill='none' stroke='#2e7d32' stroke-width='2' stroke-dasharray='7,4' marker-end='url(#ar_2e7d32)'/>
<text x='606' y='516' text-anchor='middle' font-size='10.5' fill='#2e7d32' font-weight='normal' opacity='1.0'>target</text>
<rect x='830' y='366' width='486.0' height='300.0' rx='12' fill='#fdfefe' stroke='#78909c' stroke-width='1.4' opacity='1.0'/>
<text x='844' y='390' text-anchor='start' font-size='15' fill='#263238' font-weight='bold' opacity='1.0'>两个下游用途（都只发生在训练侧）</text>
<rect x='846' y='408' width='454.0' height='74.0' rx='10' fill='green_bg' stroke='green' stroke-width='1.8' opacity='1.0'/>
<text x='1073.0' y='432' text-anchor='middle' font-size='13' fill='green' font-weight='bold' opacity='1.0'>① 监督 mlp_complexity（fig04）</text>
<text x='1073.0' y='445.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>让 m 学会“哪里该细/粗量化”</text>
<text x='1073.0' y='461.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>训练结束后标签即弃</text>
<rect x='846' y='530' width='454.0' height='74.0' rx='10' fill='orange_bg' stroke='orange' stroke-width='1.8' opacity='1.0'/>
<text x='1073.0' y='554' text-anchor='middle' font-size='13' fill='orange' font-weight='bold' opacity='1.0'>② 融合剪枝的敏感度项 t_i（fig07）</text>
<text x='1073.0' y='567.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>s = log1p(s_f+s_s+s_o) / max</text>
<text x='1073.0' y='583.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>作为剪枝分数的次要成分（份额 ≤0.3）</text>
<path d='M822,460L830,460' fill='none' stroke='#607d8b' stroke-width='2' stroke-dasharray='7,4' marker-end='url(#ar_607d8b)'/>
<path d='M822,580L830,580' fill='none' stroke='#607d8b' stroke-width='2' stroke-dasharray='7,4' marker-end='url(#ar_607d8b)'/>
<text x='826' y='336' text-anchor='middle' font-size='12' fill='#607d8b' font-weight='normal' opacity='1.0'>s</text>
<rect x='24' y='690' width='1292.0' height='66.0' rx='12' fill='#fff5f4' stroke='#c62828' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='714' text-anchor='start' font-size='15' fill='#c62828' font-weight='bold' opacity='1.0'></text>
<text x='40' y='716' text-anchor='start' font-size='13' fill='#263238' font-weight='normal' opacity='1.0'>契约审计：EMA 状态、梯度、target、z——全部只活在训练进程里；码流与解码路径不含任何一个（解码端只运行 mlp_complexity(x)，见 fig04/Table I）</text>
<text x='40' y='740' text-anchor='start' font-size='12.5' fill='#546e7a' font-weight='normal' opacity='1.0'>方向性：敏感度高 = 该锚点属性一动画面就变 = 对图像重要 = 值得细量化 / 值得留下（fig07）</text>
