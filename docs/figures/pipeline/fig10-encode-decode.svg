<rect x='8' y='8' width='1404' height='884' rx='14' fill='#fdfefe' stroke='#cfd8dc' stroke-width='1.5'/>
<text x='710.0' y='40' text-anchor='middle' font-size='21' font-weight='bold' fill='#263238'>编码 ↔ 解码：同一条 Q 路径跑两端，bit-exact 回传校验</text>
<text x='710.0' y='62' text-anchor='middle' font-size='12.5' fill='#546e7a'>编码端先把坐标 voxel 对齐 + Morton 排序再算上下文（与训练一致）；解码端从码流重算 ctx → mlp_grid → Q → 反量化；整数锚与 masks 的 SHA-256 两端一致 → mismatch=0</text>
<rect x='24' y='88' width='1372.0' height='96.0' rx='12' fill='#f2f8f2' stroke='#2e7d32' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='112' text-anchor='start' font-size='15' fill='#2e7d32' font-weight='bold' opacity='1.0'>共享 Q 路径（绿色 = 两端逐位一致的前提）</text>
<text x='40' y='122' text-anchor='start' font-size='13' fill='#263238' font-weight='normal' opacity='1.0'>round(x/voxel)·voxel → Morton 排序 → 哈希 ctx → mlp_grid → (qa,qs,qo) 与熵参数 → x=[ρ, 各向异性, 偏移能量, 掩码率] → mlp_complexity → m → Q</text>
<text x='40' y='150' text-anchor='start' font-size='12.5' fill='#2e7d32' font-weight='normal' opacity='1.0'>编码端在量化前跑这一整条；解码端在反量化前原样再跑一遍（mlp 权重与 strength=0.35 都由码流/头文件携带）→ 两端 Q 逐位相同</text>
