<circle cx='271' cy='748' r='3.2' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<circle cx='308' cy='744' r='3.5' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<rect x='376' y='676' width='300.0' height='86.0' rx='8' fill='#ffffff' stroke='#cfd8dc' stroke-width='1.2' opacity='1.0'/>
<text x='526' y='692' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>w = 0.5（敏感度主导）：大覆盖锚被删</text>
<circle cx='421' cy='718' r='14' fill='#fdeede' stroke='#e65100' stroke-width='1.6'/>
<circle cx='541' cy='722' r='13' fill='#fdeede' stroke='#e65100' stroke-width='1.6'/>
<circle cx='621' cy='716' r='13' fill='#fdeede' stroke='#e65100' stroke-width='1.6'/>
<circle cx='481' cy='714' r='12' fill='none' stroke='#c62828' stroke-width='1.6' stroke-dasharray='4,3'/>
<text x='481' y='742' text-anchor='middle' font-size='10.5' fill='#c62828' font-weight='bold' opacity='1.0'>覆盖洞!</text>
<circle cx='441' cy='744' r='3.5' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<circle cx='501' cy='746' r='3.2' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<circle cx='561' cy='744' r='3.5' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<circle cx='601' cy='748' r='3.2' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<circle cx='638' cy='744' r='3.5' fill='#eceff1' stroke='#607d8b' stroke-width='1.2'/>
<text x='366' y='786' text-anchor='middle' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>大圆 = 大覆盖锚 · 小点 = 高敏感细节锚</text>
<rect x='748' y='532' width='608.0' height='268.0' rx='12' fill='#fdfefe' stroke='#78909c' stroke-width='1.4' opacity='1.0'/>
<text x='762' y='556' text-anchor='start' font-size='15' fill='#263238' font-weight='bold' opacity='1.0'>接线条件与降级（审计后加固）</text>
<text x='764' y='566' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· fusion_prune 需同时启用 mini_splat：覆盖 provider 才会在 trainer 接线</text>
<text x='764' y='592' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 敏感度状态长度不符（如刚生长后）→ 自动降级 coverage-only，</text>
<text x='776' y='614' text-anchor='start' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>打印 [FusionPrune] SENSITIVITY_UNAVAILABLE（不再静默）</text>
<text x='764' y='640' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 每次投影打印 [FusionPrune] engaged=1 eff=… cov_mean=… sens_mean=…，</text>
<text x='776' y='662' text-anchor='start' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>engaged=0 即视为无效运行（→ fig12 静默门控审计）</text>
<text x='764' y='692' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>· 默认 fusion_sensitivity_weight = 0.3（正好在帽上）</text>
<line x1='16' y1='866' x2='1364' y2='866' stroke='#cfd8dc' stroke-width='1'/>
<text x='18' y='880' text-anchor='start' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>代码: hacplus/scene/gaussian_model.py:1670–1721（融合分数） · scaffold_gs/mini_splat.py:282–305（覆盖 provider） · trainer.py:192–208（接线）</text>
<text x='1362' y='880' text-anchor='end' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>覆盖约束（硬保证）→ fig08</text>
</svg>