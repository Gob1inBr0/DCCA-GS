<text x='680.0' y='424.5' text-anchor='middle' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>L = L_render + λ·R + λsens·L_sens + L_spa （+ L_sem：DINO 语义监督，方向一已判负，默认关）</text>
<text x='680.0' y='441.0' text-anchor='middle' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>L_render = (1−0.2)·L1 + 0.2·(1−SSIM) + 0.01·mean(∏scaling)          λ_dssim=0.2 · scale_reg=0.01</text>
<text x='680.0' y='457.5' text-anchor='middle' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>R = bit_per_param（5% 采样估计）+ bit_hash/锚点数          λ=λ_rate=0.004（RD 扫描 0.0005 / 0.002 / 0.004）</text>
<text x='680.0' y='474.0' text-anchor='middle' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>L_sens = 1e-3·MSE(pred_m, target_m)（t≥20000，→ fig05）          L_spa = (1e-3/2)·mean‖a−z+u‖²（ADMM 稀疏项，→ fig06）</text>
