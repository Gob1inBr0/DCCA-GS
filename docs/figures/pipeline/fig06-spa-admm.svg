<svg xmlns='http://www.w3.org/2000/svg' width='1340' height='860' viewBox='0 0 1340 860' font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif"><defs><marker id='ar_1565c0' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto'><path d='M0,0 L8,4.5 L0,9 z' fill='#1565c0'/></marker></defs>
<rect x='8' y='8' width='1324' height='844' rx='14' fill='#fdfefe' stroke='#cfd8dc' stroke-width='1.5'/>
<text x='670.0' y='40' text-anchor='middle' font-size='21' font-weight='bold' fill='#263238'>基础机制：SPA-ADMM 预算稀疏化（GaussianSpa，决定“留多少锚”）</text>
<text x='670.0' y='62' text-anchor='middle' font-size='12.5' fill='#546e7a'>软掩码分数 a + 对偶 u 做 TopK 硬投影，预算 κ 随训练从 N_max 线性压到 0.85·N_max；创新②只替换“排序分数”与“投影规则”（→ fig07/08），ADMM 骨架原样保留</text>
<rect x='24' y='88' width='1292.0' height='88.0' rx='12' fill='#fdfefe' stroke='#78909c' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='112' text-anchor='start' font-size='15' fill='#263238' font-weight='bold' opacity='1.0'>调用时机</text>
<text x='40' y='128' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>每 100 步（1500 &lt; it &lt; 15000，update_interval=100）在 backward 之后、optimizer.step 之前执行 adjust_anchor：先生长（offset 梯度 &gt; 2e-4 处补锚），再 SPA 投影</text>
<text x='40' y='152' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>15000 不含 → 最后一次投影发生在 @14900；训练损失侧每步都有 ADMM 二次项 L_spa = (ρ/2)·mean‖a−z+u‖²（ρ=1e-3）把 a 拉向 z</text>
<rect x='24' y='196' width='700.0' height='400.0' rx='12' fill='#f4f9ff' stroke='#1565c0' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='220' text-anchor='start' font-size='15' fill='#1565c0' font-weight='bold' opacity='1.0'>投影步（每 100 步）</text>
<rect x='40' y='240' width='320.0' height='74.0' rx='10' fill='blue_bg' stroke='blue' stroke-width='1.8' opacity='1.0'/>
<text x='200.0' y='264' text-anchor='middle' font-size='13' fill='blue' font-weight='bold' opacity='1.0'>a = mean(get_mask, dim=1) [N,1]</text>
<text x='200.0' y='277.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>软锚点分数：K 个偏移掩码的均值</text>
<text x='200.0' y='293.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>（sigmoid STE，可导，被 L_spa 优化）</text>
<rect x='40' y='348' width='320.0' height='74.0' rx='10' fill='blue_bg' stroke='blue' stroke-width='1.8' opacity='1.0'/>
<text x='200.0' y='372' text-anchor='middle' font-size='13' fill='blue' font-weight='bold' opacity='1.0'>scores = a + u</text>
<text x='200.0' y='385.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>u：ADMM 对偶变量 [N,1]</text>
<text x='200.0' y='401.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>（把历史未入选的惩罚抬进分数）</text>
<rect x='40' y='456' width='320.0' height='74.0' rx='10' fill='orange_bg' stroke='orange' stroke-width='1.8' opacity='1.0'/>
<text x='200.0' y='480' text-anchor='middle' font-size='13' fill='orange' font-weight='bold' opacity='1.0'>z = TopK(scores, κ)</text>
<text x='200.0' y='493.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>硬稀疏指示 z∈{0,1}[N]</text>
<text x='200.0' y='509.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>（或覆盖约束版 → fig08）</text>
<line x1='200' y1='314.0' x2='200' y2='345' stroke='#1565c0' stroke-width='2.0' marker-end='url(#ar_1565c0)'/>
<line x1='200' y1='422.0' x2='200' y2='453' stroke='#1565c0' stroke-width='2.0' marker-end='url(#ar_1565c0)'/>
<rect x='392' y='240' width='316.0' height='58.0' rx='10' fill='blue_bg' stroke='blue' stroke-width='1.8' opacity='1.0'/>
<text x='550.0' y='264' text-anchor='middle' font-size='13' fill='blue' font-weight='bold' opacity='1.0'>u ← clamp(u + a − z, ±1)</text>
<text x='550.0' y='277.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>对偶更新（±1 截断保稳定）</text>
<rect x='392' y='348' width='316.0' height='58.0' rx='10' fill='blue_bg' stroke='blue' stroke-width='1.8' opacity='1.0'/>
<text x='550.0' y='372' text-anchor='middle' font-size='13' fill='blue' font-weight='bold' opacity='1.0'>prune：删去 z=0 的锚</text>
<text x='550.0' y='385.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>物理删除属性与优化器状态</text>
<rect x='392' y='456' width='316.0' height='58.0' rx='10' fill='red_bg' stroke='red' stroke-width='1.8' opacity='1.0'/>
<text x='550.0' y='480' text-anchor='middle' font-size='13' fill='red' font-weight='bold' opacity='1.0'>状态张量同步切片</text>
<text x='550.0' y='493.5' text-anchor='middle' font-size='11.5' fill='#546e7a' font-weight='normal' opacity='1.0'>见下方清单（长度必须对齐）</text>
<path d='M360,500L376,500L376,276L388,276' fill='none' stroke='#1565c0' stroke-width='2' marker-end='url(#ar_1565c0)'/>
<path d='M475,348L475,340' fill='none' stroke='#1565c0' stroke-width='2' marker-end='url(#ar_1565c0)'/>
<line x1='550' y1='298.0' x2='550' y2='345' stroke='#1565c0' stroke-width='2.0' marker-end='url(#ar_1565c0)'/>
<line x1='550' y1='406.0' x2='550' y2='453' stroke='#1565c0' stroke-width='2.0' marker-end='url(#ar_1565c0)'/>
<rect x='748' y='196' width='568.0' height='400.0' rx='12' fill='#fff6ec' stroke='#e65100' stroke-width='1.4' opacity='1.0'/>
<text x='762' y='220' text-anchor='start' font-size='15' fill='#e65100' font-weight='bold' opacity='1.0'>预算 κ 的 ramp（锚定历史最大锚数，防反馈塌缩）</text>
<text x='764' y='232' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>spa_ref_n = max(spa_ref_n, N)   （历史最大锚数）</text>
<text x='764' y='258' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>progress = clamp((t − 1500) / 13500, 0, 1)</text>
<text x='764' y='284' text-anchor='start' font-size='12.5' fill='#263238' font-weight='normal' opacity='1.0'>κ = round( spa_ref_n · (1 − 0.15 · progress) )     （1500 → 15000：κ/N 1.0 → 0.85）</text>
<text x='764' y='310' text-anchor='start' font-size='12.5' fill='#546e7a' font-weight='normal' opacity='1.0'>t ≥ 15000：κ = round( spa_final_n · 0.85 )（spa_final_n 在首次越过 15000 时锁存；</text>
<text x='764' y='332' text-anchor='start' font-size='12.5' fill='#546e7a' font-weight='normal' opacity='1.0'>深度再初始化会把 spa_final_n 钉在再初始化前的锚数 → fig09）</text>
<rect x='764' y='356' width='536.0' height='150.0' rx='8' fill='#ffffff' stroke='#e65100' stroke-width='1.4' opacity='1.0'/>
<text x='778' y='376' text-anchor='start' font-size='11.5' fill='#e65100' font-weight='normal' opacity='1.0'>κ(t) 示意</text>
<line x1='814' y1='480' x2='1276' y2='480' stroke='#546e7a' stroke-width='1.2'/>
<line x1='814' y1='480' x2='814' y2='376' stroke='#546e7a' stroke-width='1.2'/>
<line x1='814' y1='480' x2='814' y2='396' stroke='#546e7a' stroke-width='1' stroke-dasharray='7,4'/>
<line x1='1276' y1='480' x2='1276' y2='408' stroke='#546e7a' stroke-width='1' stroke-dasharray='7,4'/>
<path d='M814,396 L1276,408 L1276,480' fill='none' stroke='#e65100' stroke-width='2.4'/>
<text x='814' y='496' text-anchor='middle' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>t=1500（κ=N_max）</text>
<text x='1276' y='496' text-anchor='end' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>t=15000 → 0.85·N_max</text>
<text x='1270' y='404' text-anchor='end' font-size='10.5' fill='#546e7a' font-weight='normal' opacity='1.0'>之后 0.85·spa_final_n</text>
<rect x='24' y='618' width='1292.0' height='160.0' rx='12' fill='#fff5f4' stroke='#c62828' stroke-width='1.4' opacity='1.0'/>
<text x='38' y='642' text-anchor='start' font-size='15' fill='#c62828' font-weight='bold' opacity='1.0'>prune 时的状态切片清单（全部按布尔掩码同步切片，新增 per-anchor 状态必须加进来，否则长度错位 → 运行期报错/静默错位）</text>
