<text x='953.7050000000002' y='684.5' text-anchor='middle' font-size='11.5' fill='#607d8b' font-weight='normal' opacity='1.0'>mini_splat_importance（覆盖面积）</text>
<text x='44' y='754' text-anchor='start' font-size='12' fill='#546e7a' font-weight='normal' opacity='1.0'>生长新增的锚同样要 pad 这些状态（新锚敏感度置 0、统计清零、SPA 状态初始化）</text>
